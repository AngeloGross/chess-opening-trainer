# Publishes the browser trainer (web/) to GitHub Pages (design §9, slice 9).
# web/ is served as is: no build step. positions.json is gitignored, so the CLI's output never ships.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'spec/**', 'tests-js/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # never abort a deploy half-way

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - name: Vendored files are byte-identical
        run: |
          for f in web/vendor/*/SOURCE.txt; do
            dir=$(dirname "$f")
            grep -E '^\s+\S+\s+[0-9]+\s+[0-9a-f]{64}$' "$f" | while read -r name _ sum; do
              echo "$sum  $dir/$name"
            done
          done | sha256sum --check --strict

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: No CLI output in the site
        run: test ! -e web/positions.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
