<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Trainer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="trainer.js"></script>
</head>
<body>
  <header>
    <h1>Opening Trainer</h1>
    <p id="summary" class="muted">Loading positions…</p>
  </header>

  <main>
    <aside class="list-panel">
      <div class="filters">
        <label>Opening
          <select id="filter-opening"><option value="">All openings</option></select>
        </label>
        <label>Colour
          <select id="filter-color">
            <option value="">Both</option>
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="filter-unsolved"> Unsolved only</label>
      </div>
      <ol id="position-list"></ol>
    </aside>

    <section class="board-panel">
      <div id="board"></div>
      <div class="nav">
        <button id="prev" type="button">&larr; Previous</button>
        <span id="counter" class="muted"></span>
        <button id="next" type="button">Next &rarr;</button>
      </div>
    </section>

    <section class="info-panel">
      <h2 id="pos-title">&nbsp;</h2>
      <p id="pos-meta" class="muted"></p>
      <p id="prompt"></p>
      <div id="feedback" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="retry" type="button" hidden>Retry</button>
        <button id="reveal" type="button" hidden>Reveal</button>
      </div>
      <p><a id="lichess-link" href="#" target="_blank" rel="noopener">Open in Lichess analysis</a></p>
      <div id="games"></div>
    </section>
  </main>
</body>
</html>
